plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = mod_version
group = 'com.echohorror'

base {
    archivesName = 'echohorror-1.20.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('run-client')
            property 'forge.logging.console.level', 'info'
            args '--username', 'Tester', '--quickPlayMultiplayer', 'localhost:25565'
            mods { echohorror { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            args '--nogui'
            mods { echohorror { source sourceSets.main } }
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
    // Simple Voice Chat API (optional at runtime; only used if the mod is installed)
    compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.5.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'echohorror',
            'Specification-Vendor'    : 'echohorror',
            'Specification-Version'   : '1',
            'Implementation-Title'    : 'echohorror',
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'echohorror'
        ])
    }
    finalizedBy 'reobfJar'
}
